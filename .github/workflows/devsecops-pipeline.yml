name: DevSecOps Pipeline

on:
  push:
    branches: [ feature/* ]
  pull_request:
    branches: [ feature/* ]
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab

jobs:

  # ── Stage 1: Secrets Detection ──────────────────────────────
  secrets-scan:
    name: Secrets Detection (GitLeaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history so GitLeaks scans all commits
      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Stage 2: Unit Tests ──────────────────────────────────────
  test:
    name: Server Unit Tests
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run test:server

  # ── Stage 3: SAST ────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/nodejs
            p/owasp-top-ten
        continue-on-error: true   # won't block pipeline, but logs findings

  # ── Stage 3: Dependency Scanning ─────────────────────────────
  dependency-scan:
    name: Dependency Scan (Snyk)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install --ignore-scripts
      - name: Run Snyk
        uses: snyk/actions/node@master
        continue-on-error: true
        with:
          args: --json-file-output=snyk-report.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Snyk report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-report
          path: snyk-report.json

  # ── Stage 4: Build Docker Image ───────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [sast, dependency-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t juice-shop:${{ github.sha }} .

      - name: Save image as tar
        run: docker save juice-shop:${{ github.sha }} -o juice-shop.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: juice-shop.tar

  # ── Stage 5: Container Scanning ───────────────────────────────
  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i juice-shop.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: juice-shop:${{ github.sha }}
          format: json
          output: trivy-report.json
          exit-code: '0'           # set to '1' to fail on critical CVEs
          severity: CRITICAL,HIGH

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json

  # ── Stage 6: Publish PDF Report ───────────────────────────────
  publish-report:
    name: Publish PDF Security Report
    runs-on: ubuntu-latest
    needs: [secrets-scan, test, sast, dependency-scan, build, container-scan]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download Snyk report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: snyk-report
          path: reports/

      - name: Download Trivy report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: trivy-report
          path: reports/

      - name: Generate Markdown report
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_NUM: ${{ github.run_number }}
          RESULT_SECRETS: ${{ needs.secrets-scan.result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_SAST: ${{ needs.sast.result }}
          RESULT_SNYK: ${{ needs.dependency-scan.result }}
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_TRIVY: ${{ needs.container-scan.result }}
        run: |
          python3 - <<'PYEOF'
          import os, json, datetime

          date = datetime.datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')
          lines = [
            "# DevSecOps Security Report\n",
            f"**Repository:** {os.environ['REPO']}  ",
            f"**Branch:** {os.environ['BRANCH']}  ",
            f"**Commit:** {os.environ['COMMIT']}  ",
            f"**Run:** {os.environ['RUN_NUM']}  ",
            f"**Date:** {date}  ",
            "\n---\n",
            "## Stage Results\n",
            "| Stage | Status |",
            "|-------|--------|",
            f"| Secrets Detection (GitLeaks) | {os.environ['RESULT_SECRETS']} |",
            f"| Server Unit Tests | {os.environ['RESULT_TEST']} |",
            f"| SAST (Semgrep) | {os.environ['RESULT_SAST']} |",
            f"| Dependency Scan (Snyk) | {os.environ['RESULT_SNYK']} |",
            f"| Build Docker Image | {os.environ['RESULT_BUILD']} |",
            f"| Container Scan (Trivy) | {os.environ['RESULT_TRIVY']} |",
            "\n---\n",
            "## Snyk Dependency Findings\n",
          ]

          snyk_path = "reports/snyk-report.json"
          if os.path.exists(snyk_path):
            with open(snyk_path) as f:
              data = json.load(f)
            vulns = data.get("vulnerabilities", [])
            lines.append(f"Total vulnerabilities: {len(vulns)}\n")
            for v in vulns[:20]:
              lines.append(f"- [{v.get('severity','').upper()}] {v.get('title','')} ({v.get('packageName','')}@{v.get('version','')})")
          else:
            lines.append("_Snyk report not available._")

          lines += ["\n---\n", "## Trivy Container Findings\n"]

          trivy_path = "reports/trivy-report.json"
          if os.path.exists(trivy_path):
            with open(trivy_path) as f:
              data = json.load(f)
            results = data.get("Results", [])
            total = sum(len(r.get("Vulnerabilities") or []) for r in results)
            lines.append(f"Total vulnerabilities: {total}\n")
            for r in results:
              for v in (r.get("Vulnerabilities") or [])[:20]:
                lines.append(f"- [{v.get('Severity','')}] {v.get('VulnerabilityID','')} in {v.get('PkgName','')}@{v.get('InstalledVersion','')}")
          else:
            lines.append("_Trivy report not available._")

          os.makedirs("reports", exist_ok=True)
          with open("reports/security-report.md", "w") as f:
            f.write("\n".join(lines))
          print("Report generated successfully.")
          PYEOF

      - name: Install mdpdf
        run: npm install -g mdpdf

      - name: Convert Markdown to PDF
        run: mdpdf reports/security-report.md reports/security-report.pdf

      - name: Upload PDF report
        uses: actions/upload-artifact@v4
        with:
          name: security-report-pdf
          path: reports/security-report.pdf